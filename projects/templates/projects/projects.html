{% extends "base.html" %}
{% block title %}Proyectos{% endblock %}

{% block extra_head %}
<style>
    .page-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 1.5rem;
    }

    .page-header h2 {
        margin: 0;
        font-size: 1.75rem;
        font-weight: 700;
        color: var(--ink);
    }

    .table-wrapper {
        overflow-x: auto;
        margin-top: 1rem;
    }

    .table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.95rem;
    }

    .table thead {
        background: #f9fafb;
        border-bottom: 2px solid var(--line);
    }

    .table th {
        padding: 0.85rem 1rem;
        text-align: left;
        font-weight: 600;
        color: var(--ink-2);
        font-size: 0.875rem;
        text-transform: uppercase;
        letter-spacing: 0.025em;
    }

    .table tbody tr {
        border-bottom: 1px solid var(--line);
        transition: background-color 0.15s ease;
    }

    .table tbody tr:hover {
        background: #f9fafb;
    }

    .table tbody tr:last-child {
        border-bottom: none;
    }

    .table td {
        padding: 1rem;
        color: var(--ink);
    }

    .table td:first-child {
        font-weight: 500;
        color: var(--ink-2);
    }

    .table a {
        color: var(--brand);
        text-decoration: none;
        font-weight: 500;
        transition: color 0.15s ease;
    }

    .table a:hover {
        color: var(--brand-600);
        text-decoration: underline;
    }

    .badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 2rem;
        padding: 0.25rem 0.6rem;
        border-radius: 6px;
        font-size: 0.875rem;
        font-weight: 600;
        background: #e5e7eb;
        color: var(--ink-2);
    }

    .badge-total {
        background: #dbeafe;
        color: #1e40af;
    }

    .badge-open {
        background: #fef3c7;
        color: #92400e;
    }

    .badge-fulfilled {
        background: #d1fae5;
        color: #065f46;
    }

    .btn-icon {
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
    }

    .empty-state {
        text-align: center;
        padding: 3rem 1rem;
        color: var(--ink-2);
    }

    .empty-state-icon {
        font-size: 3rem;
        margin-bottom: 0.5rem;
        opacity: 0.3;
    }

    @media (max-width: 768px) {
        .page-header {
            flex-direction: column;
            align-items: flex-start;
            gap: 1rem;
        }

        .table {
            font-size: 0.875rem;
        }

        .table th,
        .table td {
            padding: 0.65rem 0.5rem;
        }
    }
</style>
{% endblock %}

{% block content %}
<div class="card">
    <div class="page-header">
        <h2>Proyectos</h2>
        <button class="btn btn-icon" id="btnRefresh" type="button">
            <span>↻</span>
            <span>Refrescar</span>
        </button>
    </div>

    <div id="err" class="alert alert-err" style="display:none"></div>

    <div class="table-wrapper">
        <table class="table">
            <thead>
            <tr>
                <th>Nombre</th>
                <th>Inicio</th>
                <th>Fin</th>
                <th>Total</th>
                <th>Abiertas</th>
                <th>Cumplidas</th>
                <th>Necesidades</th>
                <th></th>
            </tr>
            </thead>
            <tbody id="rows">
            <tr><td colspan="8" class="muted center">Cargando…</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    const rows = document.getElementById('rows');
    const err  = document.getElementById('err');

    const detailBase = "{% url 'projects:project_detail' 0 %}";

    function detailHref(id){
        return detailBase.replace('0/', String(id) + '/');
    }

    async function loadProjects(){
        err.style.display = 'none';
        rows.innerHTML = `<tr><td colspan="8" class="muted center">Cargando…</td></tr>`;

        let r;
        try {
            r = await fetch('/api/projects/', { credentials: 'same-origin' });
        } catch(e) {
            return showError('No se pudo contactar con el servidor.');
        }

        if (r.status === 401) {
            const next = encodeURIComponent(location.pathname + location.search);
            location.href = `/auth/login/?next=${next}`;
            return;
        }

        const ctype = r.headers.get('content-type') || '';
        if (!ctype.includes('application/json')) {
            return showError('Respuesta inesperada del servidor.');
        }

        const data = await r.json();
        if (!r.ok) return showError(data?.detail || 'Error al cargar.');

        if (!data.length) {
            rows.innerHTML = `
                <tr>
                    <td colspan="8">
                        <div class="empty-state">
                            <div class="empty-state-icon">📋</div>
                            <div>No hay proyectos todavía</div>
                        </div>
                    </td>
                </tr>`;
            return;
        }

        rows.innerHTML = data.map(p => {
            const href = detailHref(p.id);
            return `
        <tr>
          <td><a href="${href}">${p.name ?? ''}</a></td>
          <td>${p.start_date ?? ''}</td>
          <td>${p.end_date ?? ''}</td>
          <td><span class="badge badge-total">${p.needs_total ?? 0}</span></td>
          <td><span class="badge badge-open">${p.needs_open ?? 0}</span></td>
          <td><span class="badge badge-fulfilled">${p.needs_fulfilled ?? 0}</span></td>
          <td>
            <a class="btn" href="${href}">Ver</a>
          </td>
        </tr>`;
        }).join('');
    }

    function showError(msg){
        rows.innerHTML = '';
        err.textContent = msg;
        err.style.display = 'block';
    }

    document.getElementById('btnRefresh').addEventListener('click', loadProjects);
    loadProjects();
</script>
{% endblock %}
