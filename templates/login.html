{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="card" style="max-width:420px; margin:0 auto">
    <h1 style="margin:.25rem 0 1rem 0;">Login</h1>
    {% if error %}
    <div class="alert alert-err">{{ error }}</div>
    {% endif %}
    <form method="post" action="{% url 'login_submit' %}">
        <input type="hidden" name="csrfmiddlewaretoken" value="{{ csrf_token }}">
        <label for="username">Usuario</label>
        <input id="username" name="username" placeholder="usuario" required>

        <label for="password" style="margin-top:.6rem">Contraseña</label>
        <input id="password" name="password" type="password" placeholder="password" required>

        <div class="actions">
            <button class="btn btn-primary" type="submit">Entrar</button>
            <a class="btn" href="{% url 'home' %}">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
