{% extends "base.html" %}
{% block title %}Ingresar{% endblock %}

{% block content %}
    <div class="card" style="max-width:420px; margin:0 auto">
        <h1 style="margin:.25rem 0 1rem 0;">Ingresar</h1>

        {% if form.non_field_errors %}
            <div class="alert alert-err">
                {% for err in form.non_field_errors %}{{ err }}{% endfor %}
            </div>
        {% endif %}

        <form method="post" action="{% url 'login' %}">
            {% csrf_token %}
            {% if next %}
                <input type="hidden" name="next" value="{{ next }}">
            {% endif %}

            <label for="id_username">Usuario</label>
            <input id="id_username" name="username" placeholder="usuario" required autofocus>

            <label for="id_password" style="margin-top:.6rem">Contraseña</label>
            <input id="id_password" name="password" type="password" placeholder="password" required>

            <div class="actions">
                <button class="btn btn-primary" type="submit">Entrar</button>
                <a class="btn" href="{% url 'home' %}">Cancelar</a>
            </div>
        </form>
    </div>
{% endblock %}
