{% extends "base.html" %}
{% block title %}Ingresar{% endblock %}

{% block content %}
    <div class="card" style="max-width:420px; margin:0 auto">
        <h1 style="margin:.25rem 0 1rem 0;">Ingresar</h1>

        {% if form.non_field_errors %}
            <div class="alert alert-err">
                {% for err in form.non_field_errors %}{{ err }}{% endfor %}
            </div>
        {% endif %}

        <form method="post" action="{% url 'login' %}">
            {% csrf_token %}
            {% if next %}
                <input type="hidden" name="next" value="{{ next }}">
            {% endif %}

            <label for="id_username">Usuario</label>
            <input id="id_username" name="username" placeholder="usuario" required autofocus>

            <label for="id_password" style="margin-top:.6rem">Contraseña</label>
            <div style="position:relative; display:flex; align-items:center">
                <input id="id_password" name="password" type="password" placeholder="password" required style="width:100%; padding-right:40px">
                <button type="button" onclick="togglePassword()" style="position:absolute; right:10px; background:none; border:none; cursor:pointer; padding:0; display:inline-flex; align-items:center; justify-content:center; width:24px; height:24px;" aria-label="Mostrar contraseña">
                    <svg id="eye-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                </button>
            </div>

            <div class="actions">
                <button class="btn btn-primary" type="submit">Entrar</button>
                <a class="btn" href="{% url 'home' %}">Cancelar</a>
            </div>
        </form>
    </div>

    <script>
        function togglePassword() {
            const passwordInput = document.getElementById('id_password');
            const eyeIcon = document.getElementById('eye-icon');

            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24" stroke="#666" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"></path><line x1="1" y1="1" x2="23" y2="23" stroke="#666" stroke-width="2" stroke-linecap="round"></line>';
            } else {
                passwordInput.type = 'password';
                eyeIcon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" stroke="#666" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"></path><circle cx="12" cy="12" r="3" stroke="#666" stroke-width="2" fill="none"></circle>';
            }
        }
    </script>
{% endblock %}
