<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Error{% endblock %}</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            background: #f8fafc;
            color: #1f2937;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .card {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            text-align: center;
        }
        .btn {
            display: inline-block;
            background: #3b82f6;
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            text-decoration: none;
            margin-top: 1rem;
        }
        .btn:hover { background: #2563eb; }
        h1 { margin-bottom: .5rem; }
        p { margin: 0; color: #6b7280; }
    </style>
</head>
<body>
{% block content %}{% endblock %}
</body>
</html>
