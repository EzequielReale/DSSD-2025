<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>{% block title %}ProjectPlanning{% endblock %}</title>
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <style>
        :root {
            --mx: 920px;
            --brand: #2d6cdf;
            --brand-light: #5a8efc;
            --danger: #e63946;
            --success: #2a9d8f;
            --gray: #6c757d;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f8f9fa;
            color: #212529;
        }

        header {
            background: var(--brand);
            color: #fff;
            padding: 1rem 0;
        }

        nav {
            max-width: var(--mx);
            margin: 0 auto;
            padding: 0 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav a {
            color: #fff;
            text-decoration: none;
            font-weight: bold;
            margin: 0 0.5rem;
        }

        nav a:hover {
            text-decoration: underline;
        }

        main {
            max-width: var(--mx);
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .card {
            background: #fff;
            border: 1px solid #dee2e6;
            border-radius: 0.5rem;
            padding: 1.5rem;
            box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075);
        }

        .grid {
            display: grid;
            gap: 1rem;
        }

        .grid-2 {
            grid-template-columns: 1fr 1fr;
        }

        .grid-3 {
            grid-template-columns: 1fr 1fr 1fr;
        }

        @media (max-width: 800px) {
            .grid-2,
            .grid-3 {
                grid-template-columns: 1fr;
            }
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #ced4da;
            border-radius: 0.375rem;
            background: #fff;
            font-size: 1rem;
        }

        textarea {
            min-height: 100px;
        }

        .btn {
            display: inline-block;
            padding: 0.75rem 1.25rem;
            border-radius: 0.375rem;
            border: 1px solid transparent;
            font-size: 1rem;
            font-weight: 600;
            text-align: center;
            cursor: pointer;
            text-decoration: none;
        }

        .btn-primary {
            background: var(--brand);
            border-color: var(--brand);
            color: #fff;
        }

        .btn-primary:hover {
            background: var(--brand-light);
        }

        .btn-secondary {
            background: var(--gray);
            border-color: var(--gray);
            color: #fff;
        }

        .btn-secondary:hover {
            background: #5a6268;
        }

        .alert {
            padding: 1rem;
            border-radius: 0.375rem;
            margin-bottom: 1rem;
        }

        .alert-warning {
            background: #fff3cd;
            border: 1px solid #ffeeba;
            color: #856404;
        }

        .alert-err {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }

        .alert-success {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }

        .center {
            text-align: center;
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
<header>
    <nav>
        <a href="/">Inicio</a>
        <a href="{% url 'projects:project_create' %}">Nuevo proyecto</a>
    </nav>
</header>
<main>
    {% block content %}{% endblock %}
</main>
</body>
</html>
